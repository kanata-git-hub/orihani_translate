name: Security regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:security
      - run: npm run build
        env:
          GEMINI_API_KEY: SECURITY_BUILD_SENTINEL_MUST_NOT_SHIP
      - name: Check client assets for server keys
        run: '! grep -R -l SECURITY_BUILD_SENTINEL_MUST_NOT_SHIP dist'
      - run: npm audit --audit-level=low
